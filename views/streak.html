<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>

<style>
.nav-btn {
  display:block;padding:.5rem 1rem;border-radius:.375rem;
  background:#374151;margin-bottom:.5rem;transition:0.2s;
}
.nav-btn:hover {background:#4f46e5}
.card{
  background:#1f1f1f;padding:1.5rem;border-radius:.75rem;
  text-align:center;
}
</style>
</head>

<body class="bg-gray-900 text-gray-100 flex h-screen">

<!-- Sidebar -->
<aside class="w-64 bg-gray-800 p-6 space-y-4">
  <h2 class="text-2xl font-bold mb-6">⚡ SkillTracker</h2>
  <a href="dashboard.html" class="nav-btn">Dashboard</a>
  <a href="skills.html" class="nav-btn">Skills</a>
  <a href="streak.html" class="nav-btn">Streak</a>
  <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded w-full mt-auto">Logout</button>
</aside>

<!-- Page Content -->
<main id="app-body" class="flex-1 p-8 overflow-y-auto"></main>


<script>
// Prevent access without login
if(!localStorage.getItem("token")) location.href="login.html";

document.addEventListener("DOMContentLoaded", () => {

  const app = document.getElementById("app-body");

  app.innerHTML = `
    <h1 class="text-3xl font-bold mb-6">Daily Streak</h1>
    
    <div class="card w-80 mx-auto mb-6">
      <p class="text-xl font-semibold text-gray-300">🔥 Current Streak</p>
      <h2 id="streakCount" class="text-6xl font-bold text-indigo-500">0</h2>
      <button onclick="refreshStreak()" class="mt-4 bg-indigo-600 hover:bg-indigo-700 p-3 rounded w-full">
        Refresh
      </button>
    </div>

    <button onclick="checkIn()" class="bg-green-600 hover:bg-green-700 p-3 rounded w-80 mx-auto block">
      Check-In Today
    </button>

    <p id="msg" class="text-center mt-4 text-gray-300"></p>
  `;

  loadStreak();
});

// Load streak from backend
async function loadStreak(){
  const res = await window.backend.streak();
  if(res.status === 401) return logout();
  document.getElementById("streakCount").innerText = res.data.streak;
}

// Check-In function (if implemented in backend)
async function checkIn(){
  const res = await window.backend.streak();
  loadStreak();
  msg.innerText = "✔ Day checked in!";
}

// Refresh streak manually
function refreshStreak(){ loadStreak(); }

// Logout
function logout(){
  localStorage.removeItem("token");
  location.href="login.html";
}
</script>

</body>
</html>
