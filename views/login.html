<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="style.css"></head>
<body style="display:flex;justify-content:center;align-items:center;">

<div style="text-align:center;background:white;padding:40px;border-radius:10px;">
  <h2>SkillTracker Login</h2>
  <input id="email" placeholder="Email"/><br/>
  <input id="password" type="password" placeholder="Password"/><br/>
  <button onclick="login()">Login</button>
  <p id="msg" style="color:red;"></p>
</div>

<script>
async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await window.backend.login({email, password});
  if(res.status === 200 && res.data.token){
    localStorage.setItem("token", res.data.token);
    window.location = "dashboard.html";
  } else {
    document.getElementById("msg").innerText = res.data?.message || "Login failed";
  }
}
</script>
</body>
</html>
