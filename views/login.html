<!DOCTYPE html><html><head>
<script src="https://cdn.tailwindcss.com"></script>
</head><body class="bg-gray-900 h-screen flex items-center justify-center text-gray-100">

<div class="bg-gray-800 p-10 rounded-xl w-[360px] space-y-6 shadow-lg">
  <h2 class="text-2xl font-bold text-center">Login</h2>

  <input id="email" class="w-full p-3 rounded bg-gray-700" placeholder="Email">
  <input id="password" type="password" class="w-full p-3 rounded bg-gray-700" placeholder="Password">

  <button onclick="login()" class="w-full bg-indigo-600 hover:bg-indigo-700 p-3 rounded">Sign In</button>
  <p id="msg" class="text-red-400 text-center"></p>
</div>

<script>
async function login(){
  const res = await window.backend.login({ email:email.value, password:password.value });
  if(res.status===200){ localStorage.setItem("token",res.data.token); location.href="dashboard.html"; }
  else msg.innerText=res.data.message;
}
</script>

</body></html>
