<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="style.css"></head>
<body>
<div class="sidebar">
  <h2>SkillTracker</h2>
  <a href="dashboard.html">Dashboard</a>
  <a href="skills.html">Skills</a>
  <a href="streak.html">Streak</a>
  <a onclick="logout()" style="background:#c62828;">Logout</a>
</div>

<div class="content">
  <h1>Dashboard</h1>
  <button onclick="loadData()">Refresh</button>
  <pre id="data"></pre>
</div>

<script>
if(!localStorage.getItem("token")) location.href="login.html";

async function loadData(){
  const res = await window.backend.dashboard();
  if(res.status === 401){ logout(); return; }
  document.getElementById("data").innerText = JSON.stringify(res.data,null,2);
}
function logout(){ window.backend.logout(); location.href="login.html"; }
loadData();
</script>
</body>
</html>
