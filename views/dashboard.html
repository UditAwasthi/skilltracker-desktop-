<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SkillTracker • Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  tailwind.config = { darkMode: 'class' }
  function toggleTheme(){ document.documentElement.classList.toggle("dark") }
</script>

<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; }
</style>
</head>

<body class="bg-[#f4f4f7] dark:bg-[#050505] text-zinc-900 dark:text-zinc-100 h-screen overflow-hidden">

<div class="flex h-full">

<!-- SIDEBAR -->
<aside class="w-[18vw] min-w-[220px] bg-white/60 dark:bg-zinc-900/60 backdrop-blur-xl
              border-r border-black/10 dark:border-white/10 p-6 flex flex-col">

  <h1 class="text-xl font-semibold mb-10 tracking-tight">SkillTracker</h1>

  <nav class="flex flex-col gap-2 text-sm font-medium">
    <a class="px-4 py-2 rounded-lg bg-black/5 dark:bg-white/10">Dashboard</a>
    <a href="skills.html" class="px-4 py-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/10">Skills</a>
    <a href="streak.html" class="px-4 py-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/10">Streak</a>
    <a href="playlist.html" class="px-4 py-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/10">Playlist</a>
    <a href="progress.html" class="px-4 py-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/10">Progress</a>
  </nav>

  <div class="mt-auto flex flex-col gap-3">
    <button onclick="toggleTheme()" class="text-xs opacity-60 hover:opacity-100">Toggle Theme</button>
    <button onclick="logout()" class="text-xs text-red-500">Logout</button>
  </div>
</aside>

<!-- MAIN -->
<main class="flex-1 p-10 overflow-y-auto">

<!-- HEADER -->
<header class="mb-10">
  <h2 class="text-3xl font-light">Dashboard</h2>
  <p class="text-sm opacity-60 mt-1">Your learning overview</p>
</header>

<!-- KPI CARDS -->
<section class="grid grid-cols-3 gap-6 mb-10">
  <div class="bg-white/60 dark:bg-zinc-900/60 p-6 rounded-2xl border border-black/10 dark:border-white/10">
    <p class="text-xs uppercase opacity-60">Active Skills</p>
    <h3 id="skillsCount" class="text-4xl font-semibold mt-2">--</h3>
  </div>

  <div class="bg-white/60 dark:bg-zinc-900/60 p-6 rounded-2xl border border-black/10 dark:border-white/10">
    <p class="text-xs uppercase opacity-60">Current Streak</p>
    <h3 id="streakCount" class="text-4xl font-semibold mt-2">--</h3>
  </div>

  <div class="bg-white/60 dark:bg-zinc-900/60 p-6 rounded-2xl border border-black/10 dark:border-white/10">
    <p class="text-xs uppercase opacity-60">Focus Today</p>
    <h3 id="focusText" class="text-lg font-medium mt-3">--</h3>
  </div>
</section>

<!-- CHARTS -->
<section class="grid grid-cols-2 gap-8">

  <div class="bg-white/60 dark:bg-zinc-900/60 p-6 rounded-2xl border border-black/10 dark:border-white/10">
    <p class="text-sm font-medium mb-4">Weekly Progress</p>
    <canvas id="progressChart"></canvas>
  </div>

  <div class="bg-white/60 dark:bg-zinc-900/60 p-6 rounded-2xl border border-black/10 dark:border-white/10">
    <p class="text-sm font-medium mb-4">Skill Distribution</p>
    <canvas id="skillChart"></canvas>
  </div>

</section>

</main>
</div>

<script>
const API = "http://localhost:8000";

setTimeout(async () => {
  const token = localStorage.getItem("token");
  if (!token) return location.href="login.html";

  try {
    const res = await fetch(`${API}/user/dashboard`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (!res.ok) throw new Error();

    const data = await res.json();

    document.getElementById("skillsCount").innerText =
      data.user.selectedskills.length;

    document.getElementById("streakCount").innerText =
      data.streak + " days";

    document.getElementById("focusText").innerText =
      data.todayFocus || "No focus set";

    renderCharts(data);

  } catch {
    localStorage.clear();
    location.href="login.html";
  }
}, 0);

function renderCharts(data){
  new Chart(progressChart, {
    type: "line",
    data: {
      labels: ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
      datasets: [{
        data: [1,2,2,3,4,5,6],
        borderColor: "#111",
        tension: 0.4
      }]
    },
    options: { plugins:{legend:{display:false}} }
  });

  new Chart(skillChart, {
    type: "bar",
    data: {
      labels: ["Frontend","Backend","DSA","DevOps"],
      datasets: [{
        data: [4,3,2,1],
        backgroundColor: "#111"
      }]
    },
    options: { plugins:{legend:{display:false}} }
  });
}

function logout(){
  localStorage.clear();
  location.href="login.html";
}
</script>

</body>
</html>
