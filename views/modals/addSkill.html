<div class="fixed inset-0 bg-black/50 flex items-center justify-center">
  <div class="bg-gray-800 p-6 rounded-xl w-96">
    <h2 class="text-xl font-bold mb-4">Add Skill</h2>
    <input id="skillName" placeholder="Skill Name" class="input mb-3">
    <input id="skillCategory" placeholder="Category" class="input mb-3">
    <button onclick="saveSkill()" class="bg-indigo-600 hover:bg-indigo-700 p-3 rounded w-full">Save</button>
  </div>
</div>

<script>
async function saveSkill(){
  await window.backend.skills.add({
    name:skillName.value,
    category:skillCategory.value,
    level:"beginner"
  });
  location.reload();
}
</script>
